[project]
name = "event-discovery-agent"
version = "0.1.0"
description = "Conversational event discovery agent (FastAPI + LangChain + Ticketmaster + HITL)"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "krityankashyap", email = "aryankashyapbanka2003@gmail.com" }
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "langchain>=1.3",
    "langgraph>=1.2",
    "langchain-groq>=0.3",
    "langchain-openai>=0.3",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
